version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-obras-db
    environment:
      POSTGRES_DB: gestao_obras
      POSTGRES_USER: gestao_obras
      POSTGRES_PASSWORD: gestao_obras123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_obras -d gestao_obras"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gestao-obras-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gestaoobras.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: