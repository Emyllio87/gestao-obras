spring:
  application:
    name: gestao-obras

  # ===========================================
  # PROFILE: DEV (default)
  # ===========================================
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/gestao_obras
    username: gestao_obras
    password: gestao_obras123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial baseline
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===========================================
# PROFILE: PROD
# ===========================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_obras}
    username: ${DB_USERNAME:gestao_obras}
    password: ${DB_PASSWORD:gestao_obras123}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

# ===========================================
# COMMON CONFIG (all profiles)
# ===========================================
server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.gestaoobras.controller

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:minha-chave-secreta-super-segura-para-desenvolvimento-nao-usar-em-producao-32chars}
    expiration: ${JWT_EXPIRATION:86400000} # 24h em millis
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 dias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.gestaoobras: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"